<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Mes Glucides V1.3</title>

  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color-scheme:light dark;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:#f4f4f7;
      color:#111;
    }

    .wrap{
      max-width:560px;
      margin:auto;
      padding:18px 16px 40px;
    }

    h1{
      font-size:30px;
      margin:8px 0 4px;
    }

    h2{
      margin:0 0 12px;
      font-size:22px;
    }

    .sub{
      color:#666;
      margin-bottom:6px;
    }

    .date{
      color:#555;
      font-weight:650;
      margin-bottom:18px;
      text-transform:capitalize;
    }

    .card{
      background:#fff;
      border-radius:18px;
      padding:16px;
      margin:12px 0;
      box-shadow:0 1px 8px rgba(0,0,0,.06);
    }

    .tabs{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding-bottom:4px;
      scrollbar-width:none;
    }

    .tabs::-webkit-scrollbar{
      display:none;
    }

    .tab{
      flex:0 0 auto;
      width:auto;
      margin:0;
      padding:10px 14px;
      border-radius:999px;
      background:#e9e9ee;
      color:#111;
      font-size:15px;
      font-weight:700;
    }

    .tab.active{
      background:#111;
      color:#fff;
    }

    label{
      display:block;
      font-weight:650;
      margin-top:12px;
      margin-bottom:6px;
    }

    input,
    select{
      width:100%;
      font-size:20px;
      padding:13px;
      border:1px solid #ccc;
      border-radius:12px;
      background:#fff;
      color:#111;
    }

    button{
      width:100%;
      font-size:18px;
      font-weight:700;
      padding:14px;
      border:0;
      border-radius:14px;
      margin-top:12px;
      cursor:pointer;
    }

    .primary{
      background:#111;
      color:#fff;
    }

    .secondary{
      background:#e9e9ee;
      color:#111;
    }

    .danger{
      background:#f2dddd;
      color:#8a1111;
    }

    .total{
      font-size:42px;
      font-weight:800;
      line-height:1;
    }

    .unit{
      font-size:18px;
      color:#666;
    }

    .menu-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .menu-card{
      border:1px solid #e3e3e8;
      border-radius:14px;
      padding:14px;
      background:#fafafa;
      min-height:120px;
    }

    .menu-card h3{
      margin:0 0 8px;
      font-size:18px;
    }

    .menu-total{
      font-size:26px;
      font-weight:800;
      margin-top:8px;
    }

    .menu-meta{
      font-size:13px;
      color:#666;
    }

    .menu-card button{
      margin-top:10px;
      padding:10px;
      font-size:15px;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      padding:12px 0;
      border-bottom:1px solid #eee;
    }

    .row:last-child{
      border-bottom:0;
    }

    .grow{flex:1}

    .food{
      font-weight:700;
    }

    .meta{
      font-size:14px;
      color:#666;
      margin-top:3px;
    }

    .grams{
      font-weight:800;
      font-size:19px;
      white-space:nowrap;
    }

    .del{
      width:auto;
      margin:0;
      padding:8px 10px;
      font-size:14px;
      background:#eee;
      color:#333;
      border-radius:10px;
    }

    .empty{
      color:#777;
      text-align:center;
      padding:18px 4px;
    }

    .hint{
      font-size:13px;
      color:#777;
      margin-top:8px;
    }

    .suggestion{
      margin-top:8px;
      padding:10px 12px;
      border-radius:12px;
      background:#f0f0f3;
      font-size:14px;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:10px;
    }

    .section-head .value{
      font-weight:800;
      font-size:24px;
    }

    @media (max-width:420px){
      .menu-grid{
        grid-template-columns:1fr;
      }
    }

    @media (prefers-color-scheme:dark){

      body{
        background:#000;
        color:#fff;
      }

      .card{
        background:#171719;
      }

      input,
      select{
        background:#0d0d0e;
        color:#fff;
        border-color:#444;
      }

      .sub,
      .date,
      .unit,
      .meta,
      .hint,
      .empty,
      .menu-meta{
        color:#aaa;
      }

      .row{
        border-color:#333;
      }

      .secondary,
      .del,
      .suggestion,
      .tab{
        background:#2b2b2e;
        color:#fff;
      }

      .tab.active{
        background:#fff;
        color:#111;
      }

      .menu-card{
        background:#111;
        border-color:#333;
      }

      .danger{
        background:#3b2020;
        color:#ffb5b5;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>Mes Glucides</h1>
  <div class="sub">V1.3 — fiches par repas</div>
  <div class="date" id="dateLabel"></div>

  <div class="card">
    <h2>Repas</h2>
    <div class="tabs" id="mealTabs"></div>
    <div class="suggestion" id="suggestion"></div>
  </div>

  <div class="card">
    <div class="section-head">
      <h2 id="menusTitle">Menus</h2>
      <div class="value" id="selectedMealTotal">0 g</div>
    </div>

    <div class="menu-grid" id="menuGrid"></div>
  </div>

  <div class="card">
    <h2>Ajouter un aliment</h2>

    <label for="food">Aliment</label>
    <input id="food" placeholder="Ex. Pain" autocomplete="off">

    <label for="qty">Quantité</label>
    <input
      id="qty"
      inputmode="decimal"
      type="number"
      min="0"
      step="0.1"
      placeholder="Ex. 2"
    >

    <label for="carbs">
      Glucides par unité/portion (g)
    </label>
    <input
      id="carbs"
      inputmode="decimal"
      type="number"
      min="0"
      step="0.1"
      placeholder="Ex. 15"
    >

    <button class="primary" id="add">
      Ajouter au repas sélectionné
    </button>
  </div>

  <div class="card">
    <div>Aujourd'hui</div>
    <div>
      <span class="total" id="dayTotal">0</span>
      <span class="unit">g de glucides</span>
    </div>
  </div>

  <div class="card">
    <div class="section-head">
      <h2 id="entriesTitle">Entrées</h2>
      <button class="secondary" id="toggleAll" style="width:auto;margin:0;padding:8px 10px;font-size:14px">
        Voir toute la journée
      </button>
    </div>

    <div id="list"></div>

    <button class="secondary" id="clear">
      Effacer la journée
    </button>
  </div>

</div>

<script>

const DAY_KEY = "mes_glucides_v1";
const MENU_KEY = "mes_glucides_menus_v12";

const MEALS = {
  dejeuner: "Déjeuner",
  diner: "Dîner",
  collation: "Collation",
  souper: "Souper",
  dodo: "Avant dodo"
};

const DAYS = [
  "dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"
];

let showAll = false;
let selectedMeal = suggestedMeal();

function localDateKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function currentDay(){
  return DAYS[new Date().getDay()];
}

function prettyDate(){
  return new Date().toLocaleDateString(
    "fr-CA",
    {
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );
}

function suggestedMeal(){
  const hour = new Date().getHours();

  if (hour < 10) return "dejeuner";
  if (hour < 14) return "diner";
  if (hour < 17) return "collation";
  if (hour < 21) return "souper";

  return "dodo";
}

function fmt(n){
  return Number(n).toLocaleString(
    "fr-CA",
    {maximumFractionDigits:1}
  );
}

let data =
  JSON.parse(localStorage.getItem(DAY_KEY) || "{}");

if (data.date !== localDateKey()){
  data = {
    date:localDateKey(),
    items:[]
  };
}

if (!Array.isArray(data.items)){
  data.items = [];
}

data.items = data.items.map(item => ({
  ...item,
  meal:item.meal || suggestedMeal()
}));

let menus =
  JSON.parse(localStorage.getItem(MENU_KEY) || "{}");

function saveDay(){
  localStorage.setItem(
    DAY_KEY,
    JSON.stringify(data)
  );
}

function saveMenus(){
  localStorage.setItem(
    MENU_KEY,
    JSON.stringify(menus)
  );
}

function menuKey(meal,slot){
  return `${currentDay()}__${meal}__${slot}`;
}

function mealTotal(meal){
  return data.items
    .filter(x => x.meal === meal)
    .reduce(
      (sum,x) => sum + Number(x.total || 0),
      0
    );
}

function dayTotal(){
  return data.items.reduce(
    (sum,x) => sum + Number(x.total || 0),
    0
  );
}

function renderTabs(){

  const tabs =
    document.getElementById("mealTabs");

  tabs.innerHTML = "";

  Object.entries(MEALS)
    .forEach(([key,label]) => {

      const btn =
        document.createElement("button");

      btn.className =
        "tab" + (key === selectedMeal ? " active" : "");

      btn.textContent =
        label;

      btn.onclick = ()=>{

        selectedMeal = key;
        showAll = false;
        render();
      };

      tabs.appendChild(btn);
    });
}

function renderMenus(){

  const grid =
    document.getElementById("menuGrid");

  grid.innerHTML = "";

  const slots = [
    ["1","Menu 1"],
    ["2","Menu 2"],
    ["3","Menu 3"],
    ["variante","Variante"]
  ];

  slots.forEach(([slot,label]) => {

    const key =
      menuKey(selectedMeal,slot);

    const menu =
      menus[key];

    const card =
      document.createElement("div");

    card.className =
      "menu-card";

    if (!menu){

      card.innerHTML = `
        <h3>${label}</h3>
        <div class="menu-meta">
          Aucun menu enregistré
        </div>

        <button class="secondary">
          Enregistrer le repas actuel
        </button>
      `;

      card.querySelector("button")
        .onclick = ()=>saveCurrentMealAsMenu(slot);

      grid.appendChild(card);

      return;
    }

    const total =
      menu.items.reduce(
        (s,x) => s + Number(x.total || 0),
        0
      );

    card.innerHTML = `
      <h3>${label}</h3>

      <div class="menu-meta">
        ${menu.items.length} aliment(s)
      </div>

      <div class="menu-total">
        ${fmt(total)} g
      </div>

      <button class="primary">
        Charger
      </button>

      <button class="secondary">
        Remplacer
      </button>

      <button class="danger">
        Supprimer
      </button>
    `;

    const buttons =
      card.querySelectorAll("button");

    buttons[0].onclick =
      ()=>loadMenu(slot);

    buttons[1].onclick =
      ()=>saveCurrentMealAsMenu(slot,true);

    buttons[2].onclick =
      ()=>deleteMenu(slot);

    grid.appendChild(card);
  });
}

function saveCurrentMealAsMenu(slot,force=false){

  const items =
    data.items
      .filter(x => x.meal === selectedMeal)
      .map(x => ({
        food:x.food,
        qty:x.qty,
        carbs:x.carbs,
        total:x.total
      }));

  if (!items.length){

    alert(
      "Aucun aliment dans ce repas à enregistrer."
    );

    return;
  }

  const key =
    menuKey(selectedMeal,slot);

  if (
    menus[key] &&
    !force &&
    !confirm("Ce menu existe déjà. Le remplacer ?")
  ){
    return;
  }

  if (
    menus[key] &&
    force &&
    !confirm("Remplacer ce menu enregistré ?")
  ){
    return;
  }

  menus[key] = {
    day:currentDay(),
    meal:selectedMeal,
    slot,
    items,
    savedAt:Date.now()
  };

  saveMenus();
  render();
}

function loadMenu(slot){

  const menu =
    menus[menuKey(selectedMeal,slot)];

  if (!menu){
    return;
  }

  menu.items.forEach(item => {

    data.items.push({
      meal:selectedMeal,
      food:item.food,
      qty:item.qty,
      carbs:item.carbs,
      total:item.total,
      time:Date.now()
    });
  });

  saveDay();
  render();
}

function deleteMenu(slot){

  const key =
    menuKey(selectedMeal,slot);

  if (!menus[key]){
    return;
  }

  if (!confirm("Supprimer ce menu enregistré ?")){
    return;
  }

  delete menus[key];

  saveMenus();
  render();
}

function renderEntries(){

  const list =
    document.getElementById("list");

  const entries =
    showAll
      ? data.items
      : data.items.filter(x => x.meal === selectedMeal);

  document
    .getElementById("entriesTitle")
    .textContent =
      showAll
        ? "Toute la journée"
        : `Entrées — ${MEALS[selectedMeal]}`;

  document
    .getElementById("toggleAll")
    .textContent =
      showAll
        ? "Voir seulement ce repas"
        : "Voir toute la journée";

  if (!entries.length){

    list.innerHTML =
      '<div class="empty">Aucune entrée ici.</div>';

    return;
  }

  list.innerHTML = "";

  entries.forEach(entry => {

    const realIndex =
      data.items.indexOf(entry);

    const row =
      document.createElement("div");

    row.className =
      "row";

    row.innerHTML = `
      <div class="grow">
        <div class="food"></div>
        <div class="meta"></div>
      </div>

      <div class="grams">
        ${fmt(entry.total)} g
      </div>

      <button class="del">
        Suppr.
      </button>
    `;

    row.querySelector(".food")
      .textContent =
        entry.food;

    row.querySelector(".meta")
      .textContent =
        `${MEALS[entry.meal]} · ${fmt(entry.qty)} × ${fmt(entry.carbs)} g`;

    row.querySelector(".del")
      .onclick = ()=>{

        data.items.splice(realIndex,1);

        saveDay();
        render();
      };

    list.appendChild(row);
  });
}

function render(){

  renderTabs();
  renderMenus();
  renderEntries();

  document
    .getElementById("menusTitle")
    .textContent =
      `Menus — ${MEALS[selectedMeal]}`;

  document
    .getElementById("selectedMealTotal")
    .textContent =
      `${fmt(mealTotal(selectedMeal))} g`;

  document
    .getElementById("dayTotal")
    .textContent =
      fmt(dayTotal());

  document
    .getElementById("suggestion")
    .textContent =
      `Repas suggéré maintenant : ${MEALS[suggestedMeal()]}`;
}

document
  .getElementById("dateLabel")
  .textContent =
    prettyDate();

document
  .getElementById("add")
  .onclick = ()=>{

    const food =
      document
        .getElementById("food")
        .value
        .trim();

    const qty =
      Number(
        document
          .getElementById("qty")
          .value
      );

    const carbs =
      Number(
        document
          .getElementById("carbs")
          .value
      );

    if (
      !food ||
      !(qty > 0) ||
      carbs < 0 ||
      Number.isNaN(carbs)
    ){

      alert(
        "Entre un aliment, une quantité et les glucides par portion."
      );

      return;
    }

    data.items.push({
      meal:selectedMeal,
      food,
      qty,
      carbs,
      total:qty * carbs,
      time:Date.now()
    });

    saveDay();

    document.getElementById("food").value = "";
    document.getElementById("qty").value = "";
    document.getElementById("carbs").value = "";

    render();
  };

document
  .getElementById("toggleAll")
  .onclick = ()=>{

    showAll = !showAll;

    render();
  };

document
  .getElementById("clear")
  .onclick = ()=>{

    if (
      confirm(
        "Effacer toutes les entrées d’aujourd’hui ? Les menus enregistrés seront conservés."
      )
    ){

      data = {
        date:localDateKey(),
        items:[]
      };

      saveDay();
      render();
    }
  };

saveDay();
saveMenus();
render();

</script>

</body>
</html>
