<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Mes Glucides V1.2</title>

  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color-scheme:light dark;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:#f4f4f7;
      color:#111;
    }

    .wrap{
      max-width:560px;
      margin:auto;
      padding:18px 16px 40px;
    }

    h1{
      font-size:30px;
      margin:8px 0 4px;
    }

    h2{
      margin-top:0;
      font-size:22px;
    }

    .sub{
      color:#666;
      margin-bottom:6px;
    }

    .date{
      color:#555;
      font-weight:650;
      margin-bottom:18px;
      text-transform:capitalize;
    }

    .card{
      background:#fff;
      border-radius:18px;
      padding:16px;
      margin:12px 0;
      box-shadow:0 1px 8px rgba(0,0,0,.06);
    }

    label{
      display:block;
      font-weight:650;
      margin-top:12px;
      margin-bottom:6px;
    }

    input,
    select{
      width:100%;
      font-size:20px;
      padding:13px;
      border:1px solid #ccc;
      border-radius:12px;
      background:#fff;
      color:#111;
    }

    button{
      width:100%;
      font-size:18px;
      font-weight:700;
      padding:14px;
      border:0;
      border-radius:14px;
      margin-top:12px;
      cursor:pointer;
    }

    .primary{
      background:#111;
      color:#fff;
    }

    .secondary{
      background:#e9e9ee;
      color:#111;
    }

    .danger{
      background:#f2dddd;
      color:#8a1111;
    }

    .total{
      font-size:42px;
      font-weight:800;
      line-height:1;
    }

    .unit{
      font-size:18px;
      color:#666;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      padding:12px 0;
      border-bottom:1px solid #eee;
    }

    .row:last-child{
      border-bottom:0;
    }

    .grow{flex:1}

    .food{
      font-weight:700;
    }

    .meta{
      font-size:14px;
      color:#666;
      margin-top:3px;
    }

    .grams{
      font-weight:800;
      font-size:19px;
      white-space:nowrap;
    }

    .del{
      width:auto;
      margin:0;
      padding:8px 10px;
      font-size:14px;
      background:#eee;
      color:#333;
      border-radius:10px;
    }

    .empty{
      color:#777;
      text-align:center;
      padding:18px 4px;
    }

    .hint{
      font-size:13px;
      color:#777;
      margin-top:8px;
    }

    .suggestion{
      margin-top:8px;
      padding:10px 12px;
      border-radius:12px;
      background:#f0f0f3;
      font-size:14px;
    }

    .meal-total{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:11px 0;
      border-bottom:1px solid #eee;
    }

    .meal-total:last-child{
      border-bottom:0;
    }

    .meal-name{font-weight:700}
    .meal-value{font-weight:800}

    .menu-status{
      margin-top:12px;
      padding:12px;
      border-radius:12px;
      background:#f0f0f3;
      line-height:1.4;
    }

    .menu-title{
      font-weight:800;
      margin-bottom:4px;
    }

    .button-row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .button-row button{
      margin-top:12px;
    }

    @media (prefers-color-scheme:dark){

      body{
        background:#000;
        color:#fff;
      }

      .card{
        background:#171719;
      }

      input,
      select{
        background:#0d0d0e;
        color:#fff;
        border-color:#444;
      }

      .sub,
      .date,
      .unit,
      .meta,
      .hint,
      .empty{
        color:#aaa;
      }

      .row,
      .meal-total{
        border-color:#333;
      }

      .secondary,
      .del,
      .suggestion,
      .menu-status{
        background:#2b2b2e;
        color:#fff;
      }

      .danger{
        background:#3b2020;
        color:#ffb5b5;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>Mes Glucides</h1>

  <div class="sub">
    V1.2 — menus habituels
  </div>

  <div class="date" id="dateLabel"></div>

  <!-- MENU HABITUEL -->

  <div class="card">

    <h2>Menu habituel</h2>

    <div class="suggestion" id="todaySuggestion"></div>

    <label for="menuMeal">
      Repas du menu
    </label>

    <select id="menuMeal">
      <option value="dejeuner">Déjeuner</option>
      <option value="diner">Dîner</option>
      <option value="collation">Collation</option>
      <option value="souper">Souper</option>
      <option value="dodo">Goûter avant dodo</option>
    </select>

    <label for="menuSlot">
      Menu
    </label>

    <select id="menuSlot">
      <option value="1">Menu 1</option>
      <option value="2">Menu 2</option>
      <option value="3">Menu 3</option>
      <option value="variante">Variante</option>
    </select>

    <div class="menu-status" id="menuStatus"></div>

    <button class="primary" id="loadMenu">
      Charger ce menu
    </button>

    <button class="secondary" id="saveMenu">
      Enregistrer le repas actuel comme ce menu
    </button>

    <button class="danger" id="deleteMenu">
      Supprimer ce menu enregistré
    </button>

    <div class="hint">
      Les menus sont enregistrés selon le jour de la semaine,
      le repas et le numéro de menu.
    </div>

  </div>

  <!-- AJOUT ALIMENT -->

  <div class="card">

    <h2>Ajouter un aliment</h2>

    <label for="meal">Repas</label>

    <select id="meal">
      <option value="dejeuner">Déjeuner</option>
      <option value="diner">Dîner</option>
      <option value="collation">Collation</option>
      <option value="souper">Souper</option>
      <option value="dodo">Goûter avant dodo</option>
    </select>

    <div class="suggestion" id="suggestion"></div>

    <label for="food">Aliment</label>

    <input
      id="food"
      placeholder="Ex. Pain"
      autocomplete="off"
    >

    <label for="qty">Quantité</label>

    <input
      id="qty"
      inputmode="decimal"
      type="number"
      min="0"
      step="0.1"
      placeholder="Ex. 2"
    >

    <label for="carbs">
      Glucides par unité/portion (g)
    </label>

    <input
      id="carbs"
      inputmode="decimal"
      type="number"
      min="0"
      step="0.1"
      placeholder="Ex. 15"
    >

    <button class="primary" id="add">
      Ajouter au repas
    </button>

    <div class="hint">
      Exemple : Pain · quantité 2 · 15 g/portion = 30 g.
    </div>

  </div>

  <!-- TOTAL JOURNÉE -->

  <div class="card">

    <div>Aujourd'hui</div>

    <div>
      <span class="total" id="dayTotal">0</span>
      <span class="unit">g de glucides</span>
    </div>

  </div>

  <!-- TOTAUX REPAS -->

  <div class="card">

    <h2>Totaux par repas</h2>

    <div id="mealTotals"></div>

  </div>

  <!-- ENTRÉES -->

  <div class="card">

    <h2>Entrées</h2>

    <div id="list"></div>

    <button class="secondary" id="clear">
      Effacer la journée
    </button>

  </div>

</div>

<script>

const DAY_KEY = "mes_glucides_v1";
const MENU_KEY = "mes_glucides_menus_v12";

const MEALS = {
  dejeuner: "Déjeuner",
  diner: "Dîner",
  collation: "Collation",
  souper: "Souper",
  dodo: "Goûter avant dodo"
};

const DAYS = [
  "dimanche",
  "lundi",
  "mardi",
  "mercredi",
  "jeudi",
  "vendredi",
  "samedi"
];

function localDateKey(){

  const d = new Date();

  const year = d.getFullYear();

  const month =
    String(d.getMonth() + 1).padStart(2,"0");

  const day =
    String(d.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;
}

function currentDay(){

  return DAYS[new Date().getDay()];
}

function prettyDate(){

  return new Date().toLocaleDateString(
    "fr-CA",
    {
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );
}

function suggestedMeal(){

  const hour = new Date().getHours();

  if (hour < 10){
    return "dejeuner";
  }

  if (hour < 14){
    return "diner";
  }

  if (hour < 17){
    return "collation";
  }

  if (hour < 21){
    return "souper";
  }

  return "dodo";
}

function fmt(n){

  return Number(n).toLocaleString(
    "fr-CA",
    {
      maximumFractionDigits:1
    }
  );
}

/* -------------------------
   DONNÉES JOURNÉE
------------------------- */

let data =
  JSON.parse(
    localStorage.getItem(DAY_KEY) || "{}"
  );

if (data.date !== localDateKey()){

  data = {
    date:localDateKey(),
    items:[]
  };
}

if (!Array.isArray(data.items)){
  data.items = [];
}

data.items =
  data.items.map(item => ({
    ...item,
    meal:item.meal || suggestedMeal()
  }));

function saveDay(){

  localStorage.setItem(
    DAY_KEY,
    JSON.stringify(data)
  );
}

/* -------------------------
   MENUS
------------------------- */

let menus =
  JSON.parse(
    localStorage.getItem(MENU_KEY) || "{}"
  );

function saveMenus(){

  localStorage.setItem(
    MENU_KEY,
    JSON.stringify(menus)
  );
}

function menuKey(day,meal,slot){

  return `${day}__${meal}__${slot}`;
}

function selectedMenuKey(){

  const meal =
    document.getElementById("menuMeal").value;

  const slot =
    document.getElementById("menuSlot").value;

  return menuKey(
    currentDay(),
    meal,
    slot
  );
}

function selectedMenu(){

  return menus[selectedMenuKey()] || null;
}

function menuTotal(menu){

  if (!menu || !Array.isArray(menu.items)){
    return 0;
  }

  return menu.items.reduce(
    (sum,item) =>
      sum + Number(item.total || 0),
    0
  );
}

function updateMenuStatus(){

  const meal =
    document.getElementById("menuMeal").value;

  const slot =
    document.getElementById("menuSlot").value;

  const menu =
    selectedMenu();

  const status =
    document.getElementById("menuStatus");

  const slotLabel =
    slot === "variante"
      ? "Variante"
      : `Menu ${slot}`;

  if (!menu){

    status.innerHTML = `
      <div class="menu-title">
        ${currentDay()} · ${MEALS[meal]} · ${slotLabel}
      </div>
      Aucun menu enregistré.
    `;

    return;
  }

  status.innerHTML = `
    <div class="menu-title">
      ${currentDay()} · ${MEALS[meal]} · ${slotLabel}
    </div>

    ${menu.items.length} aliment(s)
    · ${fmt(menuTotal(menu))} g de glucides
  `;
}

/* -------------------------
   CALCULS
------------------------- */

function mealTotal(meal){

  return data.items
    .filter(x => x.meal === meal)
    .reduce(
      (sum,x) =>
        sum + Number(x.total || 0),
      0
    );
}

/* -------------------------
   AFFICHAGE
------------------------- */

function renderMealTotals(){

  const container =
    document.getElementById("mealTotals");

  container.innerHTML = "";

  Object.entries(MEALS)
    .forEach(([key,label]) => {

      const row =
        document.createElement("div");

      row.className =
        "meal-total";

      row.innerHTML = `
        <div class="meal-name">
          ${label}
        </div>

        <div class="meal-value">
          ${fmt(mealTotal(key))} g
        </div>
      `;

      container.appendChild(row);
    });
}

function render(){

  const list =
    document.getElementById("list");

  const total =
    data.items.reduce(
      (sum,x) =>
        sum + Number(x.total || 0),
      0
    );

  document
    .getElementById("dayTotal")
    .textContent =
      fmt(total);

  renderMealTotals();
  updateMenuStatus();

  if (!data.items.length){

    list.innerHTML =
      '<div class="empty">Aucune entrée aujourd’hui.</div>';

    return;
  }

  list.innerHTML = "";

  data.items.forEach((x,i)=>{

    const row =
      document.createElement("div");

    row.className = "row";

    row.innerHTML = `
      <div class="grow">

        <div class="food"></div>

        <div class="meta"></div>

      </div>

      <div class="grams">
        ${fmt(x.total)} g
      </div>

      <button
        class="del"
        aria-label="Supprimer">
        Suppr.
      </button>
    `;

    row
      .querySelector(".food")
      .textContent =
        x.food;

    row
      .querySelector(".meta")
      .textContent =
        `${MEALS[x.meal]} · ${fmt(x.qty)} × ${fmt(x.carbs)} g`;

    row
      .querySelector(".del")
      .onclick = ()=>{

        data.items.splice(i,1);

        saveDay();

        render();
      };

    list.appendChild(row);
  });
}

/* -------------------------
   INITIALISATION
------------------------- */

const initialMeal =
  suggestedMeal();

document
  .getElementById("meal")
  .value =
    initialMeal;

document
  .getElementById("menuMeal")
  .value =
    initialMeal;

document
  .getElementById("dateLabel")
  .textContent =
    prettyDate();

document
  .getElementById("suggestion")
  .textContent =
    `Repas suggéré maintenant : ${MEALS[initialMeal]}`;

document
  .getElementById("todaySuggestion")
  .textContent =
    `Aujourd'hui : ${currentDay()} · ${MEALS[initialMeal]} suggéré`;

/* -------------------------
   AJOUT ALIMENT
------------------------- */

document
  .getElementById("add")
  .onclick = ()=>{

    const meal =
      document
        .getElementById("meal")
        .value;

    const food =
      document
        .getElementById("food")
        .value
        .trim();

    const qty =
      Number(
        document
          .getElementById("qty")
          .value
      );

    const carbs =
      Number(
        document
          .getElementById("carbs")
          .value
      );

    if (
      !food ||
      !(qty > 0) ||
      carbs < 0 ||
      Number.isNaN(carbs)
    ){

      alert(
        "Entre un aliment, une quantité et les glucides par portion."
      );

      return;
    }

    data.items.push({
      meal,
      food,
      qty,
      carbs,
      total:qty * carbs,
      time:Date.now()
    });

    saveDay();

    render();

    document
      .getElementById("food")
      .value = "";

    document
      .getElementById("qty")
      .value = "";

    document
      .getElementById("carbs")
      .value = "";

    document
      .getElementById("food")
      .focus();
  };

/* -------------------------
   ENREGISTRER MENU
------------------------- */

document
  .getElementById("saveMenu")
  .onclick = ()=>{

    const meal =
      document
        .getElementById("menuMeal")
        .value;

    const slot =
      document
        .getElementById("menuSlot")
        .value;

    const items =
      data.items
        .filter(x => x.meal === meal)
        .map(x => ({
          food:x.food,
          qty:x.qty,
          carbs:x.carbs,
          total:x.total
        }));

    if (!items.length){

      alert(
        "Aucun aliment dans ce repas à enregistrer."
      );

      return;
    }

    const key =
      menuKey(
        currentDay(),
        meal,
        slot
      );

    const slotLabel =
      slot === "variante"
        ? "Variante"
        : `Menu ${slot}`;

    if (
      menus[key] &&
      !confirm(
        `${slotLabel} existe déjà pour ${currentDay()} ${MEALS[meal]}. Le remplacer ?`
      )
    ){
      return;
    }

    menus[key] = {
      day:currentDay(),
      meal,
      slot,
      items,
      savedAt:Date.now()
    };

    saveMenus();

    updateMenuStatus();

    alert(
      `${slotLabel} enregistré pour ${currentDay()} · ${MEALS[meal]}.`
    );
  };

/* -------------------------
   CHARGER MENU
------------------------- */

document
  .getElementById("loadMenu")
  .onclick = ()=>{

    const menu =
      selectedMenu();

    if (!menu){

      alert(
        "Aucun menu enregistré ici."
      );

      return;
    }

    menu.items.forEach(item => {

      data.items.push({
        meal:menu.meal,
        food:item.food,
        qty:item.qty,
        carbs:item.carbs,
        total:item.total,
        time:Date.now()
      });
    });

    saveDay();

    render();
  };

/* -------------------------
   SUPPRIMER MENU
------------------------- */

document
  .getElementById("deleteMenu")
  .onclick = ()=>{

    const key =
      selectedMenuKey();

    if (!menus[key]){

      alert(
        "Aucun menu enregistré ici."
      );

      return;
    }

    if (
      !confirm(
        "Supprimer ce menu enregistré ?"
      )
    ){
      return;
    }

    delete menus[key];

    saveMenus();

    updateMenuStatus();
  };

/* -------------------------
   CHANGEMENTS SELECT
------------------------- */

document
  .getElementById("menuMeal")
  .onchange =
    updateMenuStatus;

document
  .getElementById("menuSlot")
  .onchange =
    updateMenuStatus;

/* -------------------------
   EFFACER JOURNÉE
------------------------- */

document
  .getElementById("clear")
  .onclick = ()=>{

    if (
      confirm(
        "Effacer toutes les entrées d’aujourd’hui ? Les menus enregistrés seront conservés."
      )
    ){

      data = {
        date:localDateKey(),
        items:[]
      };

      saveDay();

      render();
    }
  };

saveDay();
saveMenus();
render();

</script>

</body>
</html>
