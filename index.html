<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Mes Glucides V1.1</title>

  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color-scheme:light dark;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#f4f4f7;
      color:#111;
    }

    .wrap{
      max-width:560px;
      margin:auto;
      padding:18px 16px 40px;
    }

    h1{
      font-size:30px;
      margin:8px 0 4px;
    }

    h2{
      margin-top:0;
    }

    .sub{
      color:#666;
      margin-bottom:6px;
    }

    .date{
      color:#555;
      font-weight:650;
      margin-bottom:18px;
    }

    .card{
      background:#fff;
      border-radius:18px;
      padding:16px;
      margin:12px 0;
      box-shadow:0 1px 8px rgba(0,0,0,.06);
    }

    label{
      display:block;
      font-weight:650;
      margin-top:12px;
      margin-bottom:6px;
    }

    input,
    select{
      width:100%;
      font-size:20px;
      padding:13px;
      border:1px solid #ccc;
      border-radius:12px;
      background:#fff;
      color:#111;
    }

    button{
      width:100%;
      font-size:19px;
      font-weight:700;
      padding:14px;
      border:0;
      border-radius:14px;
      margin-top:14px;
      cursor:pointer;
    }

    .primary{
      background:#111;
      color:#fff;
    }

    .secondary{
      background:#e9e9ee;
      color:#111;
    }

    .total{
      font-size:42px;
      font-weight:800;
      line-height:1;
    }

    .unit{
      font-size:18px;
      color:#666;
    }

    .meal-total{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:11px 0;
      border-bottom:1px solid #eee;
    }

    .meal-total:last-child{
      border-bottom:0;
    }

    .meal-name{
      font-weight:700;
    }

    .meal-value{
      font-weight:800;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      padding:12px 0;
      border-bottom:1px solid #eee;
    }

    .row:last-child{
      border-bottom:0;
    }

    .grow{
      flex:1;
    }

    .food{
      font-weight:700;
    }

    .meta{
      font-size:14px;
      color:#666;
      margin-top:3px;
    }

    .grams{
      font-weight:800;
      font-size:19px;
      white-space:nowrap;
    }

    .del{
      width:auto;
      margin:0;
      padding:8px 10px;
      font-size:14px;
      background:#eee;
      color:#333;
      border-radius:10px;
    }

    .empty{
      color:#777;
      text-align:center;
      padding:18px 4px;
    }

    .hint{
      font-size:13px;
      color:#777;
      margin-top:8px;
    }

    .suggestion{
      margin-top:8px;
      padding:10px 12px;
      border-radius:12px;
      background:#f0f0f3;
      font-size:14px;
    }

    @media (prefers-color-scheme:dark){

      body{
        background:#000;
        color:#fff;
      }

      .card{
        background:#171719;
      }

      input,
      select{
        background:#0d0d0e;
        color:#fff;
        border-color:#444;
      }

      .sub,
      .date,
      .unit,
      .meta,
      .hint,
      .empty{
        color:#aaa;
      }

      .row,
      .meal-total{
        border-color:#333;
      }

      .secondary,
      .del,
      .suggestion{
        background:#2b2b2e;
        color:#fff;
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>Mes Glucides</h1>

  <div class="sub">
    V1.1 — repas et date réelle
  </div>

  <div class="date" id="dateLabel"></div>

  <div class="card">

    <label for="meal">Repas</label>

    <select id="meal">
      <option value="dejeuner">Déjeuner</option>
      <option value="diner">Dîner</option>
      <option value="collation">Collation</option>
      <option value="souper">Souper</option>
      <option value="dodo">Goûter avant dodo</option>
    </select>

    <div class="suggestion" id="suggestion"></div>

    <label for="food">Aliment</label>

    <input
      id="food"
      placeholder="Ex. Pain"
      autocomplete="off"
    >

    <label for="qty">Quantité</label>

    <input
      id="qty"
      inputmode="decimal"
      type="number"
      min="0"
      step="0.1"
      placeholder="Ex. 2"
    >

    <label for="carbs">
      Glucides par unité/portion (g)
    </label>

    <input
      id="carbs"
      inputmode="decimal"
      type="number"
      min="0"
      step="0.1"
      placeholder="Ex. 15"
    >

    <button class="primary" id="add">
      Ajouter au repas
    </button>

    <div class="hint">
      Exemple : Pain · quantité 2 · 15 g/portion = 30 g.
    </div>

  </div>

  <div class="card">

    <div>Aujourd'hui</div>

    <div>
      <span class="total" id="dayTotal">0</span>
      <span class="unit">g de glucides</span>
    </div>

  </div>

  <div class="card">

    <h2>Totaux par repas</h2>

    <div id="mealTotals"></div>

  </div>

  <div class="card">

    <h2>Entrées</h2>

    <div id="list"></div>

    <button class="secondary" id="clear">
      Effacer la journée
    </button>

  </div>

</div>

<script>

const KEY = "mes_glucides_v1";

const MEALS = {
  dejeuner: "Déjeuner",
  diner: "Dîner",
  collation: "Collation",
  souper: "Souper",
  dodo: "Goûter avant dodo"
};

function localDateKey(){

  const d = new Date();

  const year = d.getFullYear();

  const month =
    String(d.getMonth() + 1).padStart(2, "0");

  const day =
    String(d.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function prettyDate(){

  return new Date().toLocaleDateString(
    "fr-CA",
    {
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );
}

function suggestedMeal(){

  const hour =
    new Date().getHours();

  if (hour < 10){
    return "dejeuner";
  }

  if (hour < 14){
    return "diner";
  }

  if (hour < 17){
    return "collation";
  }

  if (hour < 21){
    return "souper";
  }

  return "dodo";
}

let data =
  JSON.parse(
    localStorage.getItem(KEY) || "{}"
  );

if (data.date !== localDateKey()){

  data = {
    date: localDateKey(),
    items: []
  };
}

if (!Array.isArray(data.items)){

  data.items = [];
}

/*
Compatibilité V1 :
les anciennes entrées n'avaient pas de repas.
On les place dans le repas suggéré.
*/
data.items =
  data.items.map(item => ({

    ...item,

    meal:
      item.meal ||
      suggestedMeal()
  }));

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );
}

function fmt(n){

  return Number(n).toLocaleString(
    "fr-CA",
    {
      maximumFractionDigits:1
    }
  );
}

function mealTotal(meal){

  return data.items
    .filter(x => x.meal === meal)
    .reduce(
      (sum,x) => sum + Number(x.total || 0),
      0
    );
}

function renderMealTotals(){

  const container =
    document.getElementById("mealTotals");

  container.innerHTML = "";

  Object.entries(MEALS)
    .forEach(([key,label]) => {

      const row =
        document.createElement("div");

      row.className =
        "meal-total";

      row.innerHTML = `
        <div class="meal-name">
          ${label}
        </div>

        <div class="meal-value">
          ${fmt(mealTotal(key))} g
        </div>
      `;

      container.appendChild(row);
    });
}

function render(){

  const list =
    document.getElementById("list");

  const total =
    data.items.reduce(
      (s,x) =>
        s + Number(x.total || 0),
      0
    );

  document
    .getElementById("dayTotal")
    .textContent =
      fmt(total);

  renderMealTotals();

  if (!data.items.length){

    list.innerHTML =
      '<div class="empty">Aucune entrée aujourd’hui.</div>';

    return;
  }

  list.innerHTML = "";

  data.items.forEach((x,i)=>{

    const row =
      document.createElement("div");

    row.className =
      "row";

    row.innerHTML = `
      <div class="grow">

        <div class="food"></div>

        <div class="meta"></div>

      </div>

      <div class="grams">
        ${fmt(x.total)} g
      </div>

      <button
        class="del"
        aria-label="Supprimer">
        Suppr.
      </button>
    `;

    row
      .querySelector(".food")
      .textContent =
        x.food;

    row
      .querySelector(".meta")
      .textContent =
        `${MEALS[x.meal]} · ${fmt(x.qty)} × ${fmt(x.carbs)} g`;

    row
      .querySelector(".del")
      .onclick = ()=>{

        data.items.splice(i,1);

        save();

        render();
      };

    list.appendChild(row);
  });
}

const mealSelect =
  document.getElementById("meal");

const initialMeal =
  suggestedMeal();

mealSelect.value =
  initialMeal;

document
  .getElementById("suggestion")
  .textContent =
    `Repas suggéré maintenant : ${MEALS[initialMeal]}`;

document
  .getElementById("dateLabel")
  .textContent =
    prettyDate();

document
  .getElementById("add")
  .onclick = ()=>{

    const meal =
      mealSelect.value;

    const food =
      document
        .getElementById("food")
        .value
        .trim();

    const qty =
      Number(
        document
          .getElementById("qty")
          .value
      );

    const carbs =
      Number(
        document
          .getElementById("carbs")
          .value
      );

    if (
      !food ||
      !(qty > 0) ||
      carbs < 0 ||
      Number.isNaN(carbs)
    ){

      alert(
        "Entre un aliment, une quantité et les glucides par portion."
      );

      return;
    }

    data.items.push({

      meal,
      food,
      qty,
      carbs,
      total:
        qty * carbs,
      time:
        Date.now()
    });

    save();

    render();

    document
      .getElementById("food")
      .value = "";

    document
      .getElementById("qty")
      .value = "";

    document
      .getElementById("carbs")
      .value = "";

    document
      .getElementById("food")
      .focus();
  };

document
  .getElementById("clear")
  .onclick = ()=>{

    if (
      confirm(
        "Effacer toutes les entrées d’aujourd’hui ?"
      )
    ){

      data = {
        date:
          localDateKey(),
        items:[]
      };

      save();

      render();
    }
  };

save();

render();

</script>

</body>
</html>
